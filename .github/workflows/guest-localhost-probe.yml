# Does *.localhost resolve inside a sandbox guest?
#
# *.localhost has no /etc/hosts entry and no authoritative server. It resolves
# only because systemd-resolved synthesizes it (RFC 6761), and glibc reaches
# resolved only through /etc/resolv.conf pointing at the stub 127.0.0.53 --
# the guest's nsswitch has no `resolve` module. The sandbox restore path used
# to replace that stub with `nameserver $DNS`, sending the lookup out of the
# guest to NXDOMAIN. CLO-4855 re-establishes the stub.
#
# Self-asserting: it fails if a guest cannot resolve *.localhost. The default
# shell carries -e, so diagnostic steps disable it explicitly and assertions
# collect failures rather than aborting on the first one.
name: guest localhost probe

on:
  workflow_dispatch:

jobs:
  localhost:
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - name: "this must be the sandbox path, or the probe proves nothing"
        run: |
          echo "runner=${RUNNER_NAME:-?}"
          case "${RUNNER_NAME:-}" in
            tenki-sandbox-*) echo "route=sandbox" ;;
            tenki-*) echo "::error::legacy route -- this job never exercised the sandbox restore path"; exit 1 ;;
            *) echo "::error::unrecognised runner name, cannot tell which path this is"; exit 1 ;;
          esac

      - name: "how this guest is wired for DNS"
        run: |
          set +e
          if [ -L /etc/resolv.conf ]; then kind=symlink
          elif [ -f /etc/resolv.conf ]; then kind=regular_file
          else kind=absent; fi
          echo "resolv_conf_kind=$kind"
          echo "--- /etc/resolv.conf ---"
          cat /etc/resolv.conf
          echo "--- nsswitch hosts line ---"
          grep '^hosts:' /etc/nsswitch.conf
          echo "--- default route (the link the fix configures) ---"
          ip -o route show default
          echo "--- resolvectl status ---"
          resolvectl status > /tmp/probe-resolvectl.txt 2>&1
          sed -n '1,24p' /tmp/probe-resolvectl.txt
          exit 0

      - name: "resolved must synthesize it, and glibc must reach resolved"
        run: |
          set +e
          fail=0

          # Asking resolved directly separates a broken resolver from a severed
          # route to it. This answers even while the bug is live.
          echo "--- resolvectl query: resolved itself ---"
          resolvectl query site-a.localhost
          if [ $? -eq 0 ]; then
            echo "resolved_synthesizes=yes"
          else
            echo "::error::systemd-resolved does not synthesize *.localhost at all"
            fail=1
          fi

          # The assertion that was failing: glibc's own route to resolved.
          echo "--- getent: what a workload actually calls ---"
          getent ahostsv4 site-a.localhost
          if [ $? -eq 0 ]; then
            echo "getent_localhost=resolved"
          else
            echo "::error::getent cannot resolve site-a.localhost -- the stub is not in glibc's path"
            fail=1
          fi

          # Regression guard: pointing glibc at resolved must not break egress.
          getent hosts github.com > /dev/null 2>&1
          if [ $? -eq 0 ]; then
            echo "external_dns=ok"
          else
            echo "::error::external DNS is broken"
            fail=1
          fi

          exit $fail

      - name: "the customer's shape: serve on loopback, reach it by name"
        run: |
          set +e
          python3 -m http.server 8181 --bind 127.0.0.1 > /tmp/probe-http.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:8181/; then break; fi
            sleep 0.5
          done
          curl -sf -o /dev/null --max-time 10 http://site-a.localhost:8181/
          if [ $? -eq 0 ]; then
            echo "curl_site_a_localhost=ok"
            exit 0
          fi
          echo "::error::cannot reach a loopback service by its *.localhost name"
          exit 1

      # Only on failure: replay the fix's own guards so the log says which one
      # bailed, instead of leaving "the stub was not established" unexplained.
      - name: "which guard bailed"
        if: failure()
        run: |
          set +e
          LINK=$(ip -o route show default | awk '{print $5; exit}')
          echo "link=$LINK"
          awk -v d=1.1.1.1 '$1=="nameserver" && $2!=d && $2!="127.0.0.53" {exit 1}' /etc/resolv.conf
          echo "awk_guard_rc=$?  (0 = file is ours, fix may proceed)"
          command -v resolvectl >/dev/null 2>&1; echo "resolvectl_present_rc=$?"
          command -v timeout >/dev/null 2>&1; echo "timeout_present_rc=$?"
          timeout 1 sudo resolvectl dns "$LINK" 1.1.1.1
          echo "resolvectl_dns_rc=$?"
          timeout 1 sudo resolvectl domain "$LINK" '~.'
          echo "resolvectl_domain_rc=$?"
          echo "--- did resolved take it? ---"
          resolvectl status "$LINK" 2>&1 | sed -n '1,12p'
          echo "--- with the stub in place, does getent work? ---"
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 127.0.0.53\noptions edns0\n' | sudo tee /etc/resolv.conf >/dev/null
          getent ahostsv4 tenki-stub-probe.localhost
          echo "getent_stub_rc=$?"
          getent hosts github.com >/dev/null 2>&1
          echo "external_via_stub_rc=$?"
          exit 0

  # A fixed-identity mesh restore never runs tenki_configure_network -- it only
  # records what the guest should have. Drift repair is the one path on such a
  # host that does run it, so this job induces hostname drift to make it run.
  #
  # A guest restored from a snapshot baked before CLO-4855 carries no ownership
  # marker, so the resolver step must leave its resolv.conf alone: it cannot be
  # told apart from one a job wrote. The hostname coming back proves the script
  # ran, and resolv.conf staying put proves the guard held.
  via-drift-repair:
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 15
    steps:
      - name: "before: this guest carries whatever the base snapshot baked in"
        run: |
          set +e
          echo "runner=${RUNNER_NAME:-?}"
          echo "hostname=$(hostname)"
          cat /etc/resolv.conf
          getent ahostsv4 site-a.localhost
          echo "localhost_before_rc=$?"
          exit 0

      - name: "induce hostname drift, which the host repairs over vsock"
        run: |
          set +e
          sudo hostname tenki-drift-probe
          echo "hostname_now=$(hostname)"
          exit 0

      - name: "wait for the host to notice and repair"
        run: sleep 100

      - name: "the repair must run and must not touch an unmarked resolv.conf"
        run: |
          set +e
          fail=0
          echo "hostname=$(hostname)"
          echo "--- resolv.conf after repair ---"
          cat /etc/resolv.conf

          case "$(hostname)" in
            tenki-drift-probe)
              echo "::error::the host never repaired the drift, so the script never ran"
              fail=1 ;;
            *) echo "script_ran=yes" ;;
          esac

          if grep -q '# Managed by tenki' /etc/resolv.conf; then
            echo "::error::an unmarked resolv.conf was taken over; it is indistinguishable from a job's"
            fail=1
          else
            echo "unmarked_resolv_conf_left_alone=yes"
          fi

          getent hosts github.com > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::external DNS is broken after the repair"
            fail=1
          fi
          exit $fail

  # Does the guest still reach the outside world through the stub WITHOUT any
  # resolvectl call? If yes the runtime cost of the fix is zero -- leaving the
  # stub alone is strictly less work than today's rm-and-rewrite.
  stub-without-resolvectl:
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - name: "what supplies resolved's upstream before anyone calls resolvectl"
        run: |
          set +e
          echo "--- /etc/systemd/resolved.conf (non-comment) ---"
          grep -vE '^\s*#|^\s*$' /etc/systemd/resolved.conf 2>&1
          echo "--- drop-ins ---"
          ls -la /etc/systemd/resolved.conf.d/ 2>&1
          cat /etc/systemd/resolved.conf.d/* 2>/dev/null
          echo "--- resolved global scope, untouched ---"
          resolvectl status > /tmp/rs0.txt 2>&1
          sed -n '1,8p' /tmp/rs0.txt
          exit 0

      - name: "point glibc at the stub and make NO resolvectl call"
        run: |
          set +e
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 127.0.0.53\noptions edns0\n' | sudo tee /etc/resolv.conf >/dev/null
          cat /etc/resolv.conf
          fail=0
          getent ahostsv4 site-a.localhost
          if [ $? -ne 0 ]; then echo "::error::*.localhost failed via stub alone"; fail=1; fi
          getent hosts github.com > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::external DNS failed through the stub with no resolvectl"
            fail=1
          else
            echo "external_via_stub_without_resolvectl=ok"
          fi
          exit $fail

      - name: "measure what the resolvectl calls would have cost"
        run: |
          set +e
          LINK=$(ip -o route show default | awk '{print $5; exit}')
          S=$(date +%s%N)
          sudo resolvectl dns "$LINK" 1.1.1.1
          M=$(date +%s%N)
          sudo resolvectl domain "$LINK" '~.'
          E=$(date +%s%N)
          echo "resolvectl_dns_ms=$(( (M-S)/1000000 ))"
          echo "resolvectl_domain_ms=$(( (E-M)/1000000 ))"
          echo "resolvectl_total_ms=$(( (E-S)/1000000 ))"
          S=$(date +%s%N); getent ahostsv4 tenki-cost-probe.localhost >/dev/null 2>&1; E=$(date +%s%N)
          echo "getent_selfcheck_ms=$(( (E-S)/1000000 ))"
          exit 0
