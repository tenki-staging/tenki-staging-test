name: Probe needrestart killing the runner

# Reproduces the failure that killed a real job on the sandbox runner path:
# needrestart restarts guest-agent.service mid-job, and the runner dies with it
# because it lives in that unit's cgroup. See
# https://github.com/LuxorLabs/tenki.app/actions/runs/32982565208/job/98223347033
# where the runner took the signal 4.6 ms after the restart.
#
# What actually makes needrestart pick guest-agent is NOT the libssl upgrade in
# that log: guest-agent is a static binary and links no shared library. It is
# picked because its binary was replaced under the running process - which the
# sandbox stack does whenever the node-agent's bundled guest-agent differs from
# the one baked into the image - so the process maps a deleted file. The apt
# transaction is only what makes needrestart run at all. Step 2 recreates that
# condition rather than hoping the archive happens to be ahead of the image.
#
# The last step fails if guest-agent was never restarted. A green run that
# never triggered the fault proves nothing, and this probe refuses to produce
# one.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner pool to probe"
        required: false
        default: "tenki-staging-standard-small-2c-4g"
        type: string

jobs:
  probe:
    runs-on: ${{ inputs.runner_label || 'tenki-staging-standard-small-2c-4g' }}
    steps:
      - name: Where does this runner live
        run: |
          set -u
          echo "cgroup: $(cat /proc/$$/cgroup)"
          case "$(cat /proc/$$/cgroup)" in
            *guest-agent.service*) echo "ARRANGEMENT=old (inside guest-agent)" ;;
            *tenki-runner-*)       echo "ARRANGEMENT=new (own transient unit)" ;;
            *)                     echo "ARRANGEMENT=unknown" ;;
          esac
          systemctl show -p ActiveEnterTimestamp --value guest-agent.service > /tmp/ga-before
          echo "guest-agent started at: $(cat /tmp/ga-before)"

      - name: The toolchain environment survived the unit split
        run: |
          set -u
          # The runner used to be a child of guest-agent and inherited its
          # environment. It is started by pid 1 now, so the ~49 variables the
          # image bakes reach a job only because the node-agent copies them into
          # the unit's EnvironmentFile. If that copy ever breaks, setup-* actions
          # silently re-download what /opt/hostedtoolcache already holds.
          missing=""
          for var in JAVA_HOME RUNNER_TOOL_CACHE AGENT_TOOLSDIRECTORY; do
            if [ -z "${!var:-}" ]; then missing="$missing $var"; else echo "$var=${!var}"; fi
          done
          # Reported, not asserted: the local debug API this probe drives pins the
          # job's cache config to empty, so these two are never set on this path.
          # Endpoints are not printed either - this repository is public.
          for var in GOPROXY TENKI_CACHE_URL; do
            if [ -z "${!var:-}" ]; then echo "$var unset (cache pinned off by the probe harness)"; else echo "$var is set"; fi
          done
          echo "HOME=$HOME user=$(id -un)"
          echo "versioned toolchain variants visible: $(env | grep -cE '^(JAVA_HOME_[0-9]+_X64|GOROOT_1_[0-9]+_X64)=')"
          # Set is not enough - it has to point at the toolcache the image baked.
          if [ -n "${RUNNER_TOOL_CACHE:-}" ] && [ -d "$RUNNER_TOOL_CACHE" ]; then
            echo "toolcache entries: $(ls -1 "$RUNNER_TOOL_CACHE" | wc -l)"
          else
            missing="$missing RUNNER_TOOL_CACHE(no-such-dir)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::missing from the job environment:$missing"
            exit 1
          fi
          echo "the toolchain environment survived the unit split"

      - name: Make needrestart want to restart guest-agent, then run apt
        run: |
          set -u
          P=$(systemctl show -p MainPID --value guest-agent.service)
          echo "guest-agent pid $P, deleted mappings before: $(sudo grep -c deleted /proc/$P/maps || true)"
          # Replace the binary under the running process, which is what a
          # guest-agent version bump does to a live VM.
          sudo cp /usr/local/bin/sandbox /tmp/ga-copy
          sudo mv /tmp/ga-copy /usr/local/bin/sandbox
          echo "deleted mappings after:  $(sudo grep -c deleted /proc/$P/maps || true)"
          sudo NEEDRESTART_MODE=a apt-get install -y --reinstall libssl3t64 2>&1 | tail -15

      - name: Restart guest-agent directly if needrestart declined
        run: |
          set -u
          NOW=$(systemctl show -p ActiveEnterTimestamp --value guest-agent.service)
          if [ "$NOW" = "$(cat /tmp/ga-before)" ]; then
            echo "needrestart left it alone; taking the same action it takes"
            sudo systemctl restart guest-agent.service
            sleep 5
          else
            echo "needrestart restarted it on its own"
          fi

      - name: The fault fired and the job is still here
        run: |
          set -u
          BEFORE=$(cat /tmp/ga-before)
          AFTER=$(systemctl show -p ActiveEnterTimestamp --value guest-agent.service)
          echo "guest-agent before: $BEFORE"
          echo "guest-agent after:  $AFTER"
          echo "cgroup: $(cat /proc/$$/cgroup)"
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "::error::guest-agent was never restarted - this run proves nothing"
            exit 1
          fi
          echo "the job outlived a guest-agent restart"
