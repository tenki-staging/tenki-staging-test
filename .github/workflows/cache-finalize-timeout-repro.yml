name: Repro cache finalize timeout

# Reproduces the guest-proxy response-header timeout that aborts
# FinalizeCacheEntryUpload on large Actions caches.
#
# Signature we are hunting, from hashbender/elph run 32578990222:
#   Sent <N> of <N> (100.0%)
#   Attempt 1 of 5 failed with error: Unexpected token 'c', "cache upst"... is not valid JSON
#   ##[warning]Failed to save: Failed to FinalizeCacheEntryUpload: ... (404) Not Found
# The gap between the first two lines is a constant 30.0s: vm-agent's guest
# cache proxy bounds upstream response headers, and finalize merges every block
# (and syncs to R2) before it writes one.
#
# Kept deliberately close to elph: swatinem/rust-cache@v2.9.1, cache-provider
# github, Rust 1.97.0, real cargo registry + target content.
#
# Cache size is the only variable that matters, and compiling elph's dependency
# tree to reach ~2 GB would take the better part of an hour, so the cargo cache
# is padded with incompressible bytes to hit a target size in under a minute.
# Keep padding_gb under ~9: the cache service rejects entries over its
# max_upload_size (10 GB by default) with a 413, which is a different failure.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Runner pool to run on
        required: false
        default: tenki-staging-standard-small-2c-4g
        type: string
      padding_gb:
        description: Incompressible GB added to the cache (0 = cargo cache only). Clamped to free disk.
        required: false
        default: "2"
        type: string
      mode:
        description: preflight = report cache wiring only; repro = build, pad and save
        required: false
        default: preflight
        type: choice
        options: [preflight, repro]

permissions:
  contents: read
  actions: read

env:
  CI: true
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  preflight:
    name: preflight
    runs-on: ${{ inputs.runner_label }}
    outputs:
      verdict: ${{ steps.wiring.outputs.verdict }}
    steps:
      - name: Cache endpoint this runner was handed
        id: wiring
        run: |
          set -uo pipefail
          RESULTS="${ACTIONS_RESULTS_URL:-}"
          echo "ACTIONS_RESULTS_URL = ${RESULTS:-<unset>}"
          echo "ACTIONS_CACHE_URL   = ${ACTIONS_CACHE_URL:-<unset>}"
          echo "--- cache entries in /etc/hosts ---"
          grep -i cache /etc/hosts || echo "(none)"

          # The guest proxy binds the data port on the VM's primary address and
          # the control port on loopback. The loopback control port exists only
          # when configure() actually started the proxy, which needs a non-empty
          # ActionsCacheClaim — and the proxy is what imposes the timeout under
          # test. So this single probe separates "cache wired through the proxy"
          # from "cache wired straight to the upstream".
          CTRL=down
          if (exec 3<>/dev/tcp/127.0.0.1/49194) 2>/dev/null; then CTRL=up; fi
          echo "guest proxy control port 49194 = $CTRL"

          if [ -z "$RESULTS" ]; then
            VERDICT=cache_off
          elif [ "$CTRL" = up ]; then
            VERDICT=guest_proxy
          else
            VERDICT=direct_upstream
          fi
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          case "$VERDICT" in
            cache_off)
              echo "VERDICT cache_off — no Actions cache endpoint reached this job."
              echo "Next: node-agent is not supplying a cache host. Check cache.actions_cache,"
              echo "cache.cache_host_ip and cache.cache_hosts on this node, and that a staging"
              echo "proxycache is actually reachable at that address."
              echo "::warning::cache_off — repro not possible yet"
              ;;
            direct_upstream)
              echo "VERDICT direct_upstream — cache is wired, but straight to the upstream."
              echo "Next: engine issued no actions_cache_claim, so vm-agent returned the upstream"
              echo "URL and never started the guest proxy. Set actions_cache_claim"
              echo "(audience / active_key_id / signing_key) or the timeout stays out of the path."
              echo "::warning::direct_upstream — claim missing, repro not possible yet"
              curl -sS -m 10 -o /dev/null -w 'upstream probe: HTTP %{http_code} in %{time_total}s\n' "$RESULTS" || true
              ;;
            guest_proxy)
              echo "VERDICT guest_proxy — the guest proxy IS in the path. Repro is possible; run mode=repro."
              curl -sS -m 10 -o /dev/null -w 'twirp probe: HTTP %{http_code} in %{time_total}s\n' \
                -X POST -H 'Content-Type: application/json' -d '{}' \
                "${RESULTS%/}/twirp/github.actions.results.api.v1.CacheService/FinalizeCacheEntryUpload" || true
              ;;
          esac

      # Whether this vm-agent can host the guest cache proxy at all. Go symbol
      # names live in a compressed pclntab and cannot be grepped, but string
      # constants sit in rodata and can. Checking this costs one job; the
      # alternative (delete snapshot, inject binary, rebuild snapshot) does not.
      - name: Does this vm-agent have the guest cache proxy
        id: capability
        run: |
          set -uo pipefail
          BIN=/usr/local/bin/vm-agent
          if [ ! -f "$BIN" ]; then
            echo "capable=unknown" >> "$GITHUB_OUTPUT"
            echo "$BIN not present"
            exit 0
          fi
          MISSING=0
          for pat in \
            "/tenki/actions-cache/v1/register" \
            "github.actions.results.api.v1.CacheService" \
            "cache upstream unavailable"; do
            if grep -a -q "$pat" "$BIN"; then
              echo "present: $pat"
            else
              echo "MISSING: $pat"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 0 ]; then
            echo "capable=true" >> "$GITHUB_OUTPUT"
            echo "This vm-agent CAN host the guest cache proxy; an unset ACTIONS_RESULTS_URL points at engine/node-agent config, not at this binary."
          else
            echo "capable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This vm-agent predates the guest cache proxy; it needs a rollout (and a snapshot rebuild) before the repro can work."
          fi

      - name: Summary
        run: |
          {
            echo "### Preflight"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| ACTIONS_RESULTS_URL | \`${ACTIONS_RESULTS_URL:-<unset>}\` |"
            echo "| verdict | **${{ steps.wiring.outputs.verdict }}** |"
            echo "| runner | \`$(hostname)\` |"
            echo "| nproc | $(nproc) |"
            echo "| vm-agent has guest proxy | ${{ steps.capability.outputs.capable }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  repro:
    name: repro (${{ inputs.padding_gb }}G padding)
    needs: preflight
    if: ${{ inputs.mode == 'repro' }}
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt

      # A real cargo workspace, so the cached bytes are a genuine registry +
      # target tree rather than only padding.
      - name: Create cargo workspace
        run: |
          set -euo pipefail
          mkdir -p rust-repro/src
          cat > rust-repro/Cargo.toml <<'TOML'
          [package]
          name = "cache-repro"
          version = "0.1.0"
          edition = "2021"

          [dependencies]
          tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          regex = "1"
          TOML
          cat > rust-repro/src/main.rs <<'RS'
          fn main() {
              println!("cache repro");
          }
          RS
          cd rust-repro && cargo generate-lockfile

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2.9.1
        with:
          # Unique per run: forces a cold restore and a real save every time,
          # so a prior hit can never mask the save path under test.
          shared-key: repro-${{ github.run_id }}-${{ inputs.padding_gb }}g
          workspaces: rust-repro
          cache-directories: ~/repro-padding
          cache-on-failure: true
          cache-bin: false
          save-if: "true"
          cache-provider: github

      - name: Build
        run: cd rust-repro && cargo build

      - name: Pad the cache to size
        run: |
          set -euo pipefail
          WANT="${{ inputs.padding_gb }}"
          mkdir -p ~/repro-padding

          # rust-cache writes cache.tzst next to the workspace on this same disk,
          # and the padding is incompressible, so the tarball is about as large as
          # the padding. Budget for both plus headroom or the save dies on ENOSPC,
          # which looks nothing like the timeout under test.
          AVAIL_MB=$(df -Pm "$HOME" | awk 'NR==2{print $4}')
          MAX_GB=$(( (AVAIL_MB - 3072) / 2048 ))
          [ "$MAX_GB" -lt 0 ] && MAX_GB=0
          GB="$WANT"
          if [ "$GB" -gt "$MAX_GB" ]; then
            echo "::warning::padding clamped from ${WANT}G to ${MAX_GB}G (only ${AVAIL_MB}MB free); a smaller cache may not trip the timeout"
            GB="$MAX_GB"
          fi
          echo "padding = ${GB}G (requested ${WANT}G, free ${AVAIL_MB}MB)"

          if [ "$GB" -gt 0 ]; then
            # Incompressible, or zstd would shrink it back below the threshold.
            for i in $(seq 1 "$GB"); do
              dd if=/dev/urandom of="$HOME/repro-padding/pad-$i.bin" bs=1M count=1024 status=none
            done
          fi
          du -sh ~/repro-padding rust-repro/target ~/.cargo/registry 2>/dev/null || true

      - name: What the post step is about to save
        run: |
          {
            echo "### Repro job"
            echo
            echo "Padding: ${{ inputs.padding_gb }} GB"
            echo
            echo "The cache save runs in this job's **post** step, below the last"
            echo "step above. Look there for \`Sent … (100.0%)\` followed 30s later"
            echo "by \`\"cache upst\"… is not valid JSON\`."
          } >> "$GITHUB_STEP_SUMMARY"

