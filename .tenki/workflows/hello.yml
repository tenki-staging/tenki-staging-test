name: hello
on:
  push:
  workflow_dispatch:
jobs:
  hello:
    runs-on: tenki-staging-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v4
      - run: uname -a && cat /etc/os-release
      - run: whoami && nproc && free -h && df -h /
      - name: Detect base image (actions-runner ships only in the runner image)
        run: |
          if runner=$(ls -d /home/*/actions-runner 2>/dev/null); then
            echo "BASE IMAGE: runner ($runner)"
          else
            echo "BASE IMAGE: ci (no /home/*/actions-runner)"
          fi
      - name: Read the SECRET_TESTING workspace secret
        env:
          SECRET_TESTING: ${{ secrets.SECRET_TESTING }}
        run: |
          echo "masked: ${{ secrets.SECRET_TESTING }}"
          echo "length: ${#SECRET_TESTING}"
          echo "sha256: $(printf %s "$SECRET_TESTING" | sha256sum | cut -d' ' -f1)"
          # Spaced and hex forms are not masked, so the value can be checked by eye.
          echo "spaced: $(printf %s "$SECRET_TESTING" | sed 's/./& /g')"
          echo "hex: $(printf %s "$SECRET_TESTING" | od -An -tx1 | tr -d ' \n')"
